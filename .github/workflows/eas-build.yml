name: Expo EAS Build

on:
  push:
    branches:
      - main
    paths:
      - package.json
      - app.config.js
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS profile to use (development, preview, production)'
        default: preview
        required: true
      platform:
        description: 'Target platform (android, ios, all)'
        default: all
        required: true

jobs:
  eas-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure app version bump
        if: ${{ github.event_name == 'push' }}
        run: |
          if ! git rev-parse HEAD^ >/dev/null 2>&1; then
            echo 'Skipping version bump guard on initial commit'
            exit 0
          fi
          old_version=$(git show HEAD^:package.json | jq -r '.version')
          new_version=$(jq -r '.version' package.json)
          if [ "$old_version" = "$new_version" ]; then
            echo "package.json version remains $new_version; aborting auto build." >&2
            exit 1
          fi
          old_code=$(git show HEAD^:package.json | jq -r '.versionInfo.androidVersionCode // empty')
          new_code=$(jq -r '.versionInfo.androidVersionCode // empty')
          if [ -n "$old_code" ] && [ -n "$new_code" ] && [ "$old_code" = "$new_code" ]; then
            echo "androidVersionCode unchanged ($new_code); aborting auto build." >&2
            exit 1
          fi

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm install --global eas-cli

      - name: Run EAS build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build \
            --profile "${{ github.event.inputs.profile }}" \
            --platform "${{ github.event.inputs.platform }}" \
            --non-interactive

      - name: Write Google service account key
        if: ${{ github.event.inputs.platform != 'ios' }}
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          python3 - <<'PY'
          import base64
          import binascii
          import json
          import os
          import sys

          raw = os.environ.get('GOOGLE_SERVICE_ACCOUNT_JSON', '').strip()
          if not raw:
              sys.stderr.write('GOOGLE_SERVICE_ACCOUNT_JSON secret is empty or unavailable\n')
              sys.exit(1)

          payloads = []
          try:
              decoded = base64.b64decode(raw.encode(), validate=True).decode()
          except (binascii.Error, UnicodeDecodeError):
              decoded = None
          else:
              payloads.append(decoded)
          payloads.append(raw)

          last_error = None
          for payload in payloads:
              try:
                  json.loads(payload)
              except json.JSONDecodeError as exc:
                  last_error = exc
                  continue
              with open('service-account.json', 'w', encoding='utf-8') as fh:
                  fh.write(payload)
              break
          else:
              sys.stderr.write(
                  'GOOGLE_SERVICE_ACCOUNT_JSON must be valid JSON or base64-encoded JSON '
                  f'(last error: {last_error})\n'
              )
              sys.exit(1)
          PY

      - name: Submit Android build to Google Play
        if: ${{ github.event.inputs.platform != 'ios' }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas submit \
            --profile production \
            --platform android \
            --latest \
            --non-interactive

      - name: Clean up service account key
        if: ${{ github.event.inputs.platform != 'ios' }}
        run: rm -f service-account.json
