name: Expo EAS Build

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS profile to use (development, preview, production)'
        default: preview
        required: true
      platform:
        description: 'Target platform (android, ios, all)'
        default: all
        required: true

jobs:
  eas-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm install --global eas-cli

      - name: Run EAS build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build \
            --profile "${{ github.event.inputs.profile }}" \
            --platform "${{ github.event.inputs.platform }}" \
            --non-interactive
